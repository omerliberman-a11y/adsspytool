[tool.poetry]
name = "adspy"
version = "0.1.0"
description = "Internal ad intelligence tool"
authors = ["adspy team"]
readme = "README.md"
packages = [{ include = "adspy" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.36"
psycopg = { extras = ["binary"], version = "^3.2.3" }
alembic = "^1.13.3"
celery = { extras = ["redis"], version = "^5.4.0" }
redis = "^5.2.0"
apify-client = "^1.8.0"
httpx = "^0.27.2"
typer = "^0.13.0"
structlog = "^24.4.0"
tenacity = "^9.0.0"
python-dateutil = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
types-python-dateutil = "^2.9.0"

[tool.poetry.scripts]
adspy = "adspy.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*", "apify_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
