services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: adspy
      POSTGRES_PASSWORD: adspy
      POSTGRES_DB: adspy
    ports:
      - "5434:5432"
    volumes:
      - adspy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adspy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  adspy_pg:
